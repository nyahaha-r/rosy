<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロージークロニクル 4thシングル個別イベントプランナー</title>
<style>
:root{--line:#e8dfe8;--ink:#302636}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#fbf9fb;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input{font:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #7652da;outline-offset:1px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:43px;padding:5px 12px;background:#85366d;color:white}
.top h1{margin:0;font-size:16px;white-space:nowrap}.top a{font-size:11px;color:#fff;text-decoration:underline;white-space:nowrap}.summary{font-size:12px;white-space:nowrap}.summary strong{font-size:17px;font-variant-numeric:tabular-nums}.shipping-note{font-size:11px;white-space:nowrap}.space{flex:1}
.top button{padding:5px 9px;border:1px solid #ffffff80;border-radius:6px;background:#ffffff18;color:white;cursor:pointer;font-size:11px}.top button:hover{background:#ffffff38}.top button:disabled{opacity:.6;cursor:wait}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:5px 9px}
.viewport{flex:1;min-height:0;overflow:auto;background:white;border:1px solid var(--line);border-radius:7px}
.grid{display:grid;grid-template-columns:62px repeat(5,minmax(225px,1fr));grid-template-rows:69px repeat(14,minmax(32px,1fr));min-width:1250px;min-height:520px;height:100%}
.cell{display:flex;align-items:center;min-width:0;min-height:0;padding:0 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.grid>.cell:nth-child(6n){border-right:0}
.head{position:sticky;top:0;z-index:3;background:#fff5fa;border-bottom:2px solid #e8c4d5}
.time{position:sticky;left:0;z-index:2;justify-content:center;background:#fbf6f9;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}.time.head{z-index:5}
.day{display:block;padding:4px 7px}.day-top{display:flex;align-items:center;justify-content:space-between;gap:5px}.day-top strong{font-size:15px}.day-count{font-size:11px;white-space:nowrap}
.venue{margin-top:2px;font-size:12px;line-height:1.35;color:#5d5065;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-bottom{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:2px}.costume{min-width:0;flex:1;font-size:11.5px;line-height:1.35;color:#665a70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-price{flex:none;text-align:right;font-size:13px;font-weight:700;color:#9a356a;font-variant-numeric:tabular-nums}
.event{gap:5px}.event .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}.event .start{flex:0 0 36px;text-align:right;color:#765f70;font-size:11px;font-variant-numeric:tabular-nums}
.event .start.different-time{color:#d00029;font-weight:900;background:#fff0ee;border-radius:4px;padding:2px 1px;text-align:center}
.event input{flex:0 0 48px;width:48px;height:24px;padding:1px 4px;border:1px solid #cfc4ce;border-radius:5px;background:#fff;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}.event input::-webkit-inner-spin-button{opacity:.35}.event.has-value{box-shadow:inset 3px 0 #994071}.blank{justify-content:center;background:#fbfafb;color:#ccc}
.type-photo{background:#fce8f0}.type-talk{background:#e7f3ff}.type-group{background:#e6f5f2}.type-sign{background:#fff2d8}.type-draw{background:#f0eaff}.type-game{background:#eaf4df}.type-sport{background:#ffe9d9}
@media(max-width:800px){.top{gap:7px}.top h1{font-size:14px}}
</style>
</head>
<body>
<div class="top">
 <h1>ロージークロニクル 4thシングル個別イベントプランナー</h1>
 <a href="https://helloproject.com/event/282f99b7376c9a85cef549dc3f60967f27c161d41cac9c7078923659b75556fa/" target="_blank" rel="noopener noreferrer">公式情報 ↗</a>
 <span class="summary">合計 <strong id="allCount">0</strong> 枚</span>
 <span class="summary">合計金額 <strong id="allPrice">¥0</strong></span><span class="shipping-note">＊送料別</span>
 <span class="space"></span><button id="csv" type="button">CSV保存</button><button id="capture" type="button" title="表示中の画面をPNGで保存">画面キャプチャ保存</button><button id="reset" type="button">リセット</button>
</div>
<main><div class="viewport" role="region" aria-label="イベント日程一覧" tabindex="0"><div class="grid" id="grid"></div></div></main>
<script>
'use strict';
const days=[
 {id:'1115',date:'2026-11-15',label:'11/15（日）',venue:'泉ガーデンギャラリー｜東京',costume:'だって大凶じゃん☆'},
 {id:'1128',date:'2026-11-28',label:'11/28（土）',venue:'泉ガーデンギャラリー｜東京',costume:'なじられたって泣けない 愛されたって泣けない'},
 {id:'1206',date:'2026-12-06',label:'12/6（日）',venue:'ベルサール渋谷ファーストB1｜東京',costume:'Blueprint ※運動会を除く'},
 {id:'1213',date:'2026-12-13',label:'12/13（日）',venue:'ベルサール飯田橋ファースト｜東京',costume:'Turn the Leaf!'},
 {id:'1220',date:'2026-12-20',label:'12/20（日）',venue:'ATC ITM棟4F｜大阪',costume:'なじられたって泣けない 愛されたって泣けない'}
];
const times=['11:00','11:40','12:45','13:15','13:55','14:25','15:05','15:35','16:15','16:45','17:25','17:50','18:50','19:30'];
const common={0:['全員ワイドチェキ会','photo'],1:['2ショットチェキ会','photo'],2:['個別お話し会 第1部','talk'],3:['個別お話し会 第2部','talk'],4:['グループお話し会 第1部','group'],6:['個別お話し会 第3部','talk'],7:['個別お話し会 第4部','talk'],8:['グループお話し会 第2部','group']};
const variants={
 '1115':{5:['個別お絵描き会','draw'],9:['個別指数当てゲーム','game'],13:['全員サイン会','sign']},
 '1128':{5:['個別サイン会','sign'],9:['個別あっちむいてホイゲーム','game'],13:['個別お絵描き会','draw']},
 '1206':{5:['個別サイン会','sign'],9:['個別以心伝心ゲーム','game'],10:['個別ランダムチェキサイン会','sign']},
 '1213':{5:['個別サイン会','sign'],9:['個別指数当てゲーム','game'],13:['個別ランダムチェキサイン会','sign']},
 '1220':{5:['個別サイン会','sign'],9:['個別あっちむいてホイゲーム','game'],13:['全員サイン会','sign']}
};
function getEvent(day,i){
 if(day.id==='1206'){
  if(i===11)return null;
  if(i===12)return {name:'個別お話し会 第5部',type:'talk',time:'18:30'};
  if(i===13)return {name:'ロージー運動会',type:'sport',time:'19:10'};
 }
 const fallback=i===10?['個別お話し会 第5部','talk']:i===11?['個別お話し会 第6部','talk']:['個別お話し会 第7部','talk'];
 const [name,type]=variants[day.id][i]||common[i]||fallback;
 return {name,type,time:times[i]};
}
function unitPrice(ev){
 if(['全員ワイドチェキ会','2ショットチェキ会','全員サイン会'].includes(ev.name))return 6780;
 if(['個別お絵描き会','個別ランダムチェキサイン会'].includes(ev.name))return 5480;
 if(['sign','game','sport'].includes(ev.type))return 4690;
 return 1300;
}
const storageKey='rosy-2026-simple-v1';let values={};
try{const data=JSON.parse(localStorage.getItem(storageKey));if(data&&typeof data==='object'&&!Array.isArray(data))values=data}catch(_){}
function valid(value,max=9999){const n=Number(value);return Number.isSafeInteger(n)&&n>=0?Math.min(n,max):0}
function escapeHTML(value){return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const grid=document.getElementById('grid');let html='<div class="cell time head">時刻</div>';
for(const day of days){
 html+=`<div class="cell head day"><div class="day-top"><strong>${day.label}</strong><span class="day-count" id="count-${day.id}">0枚</span></div><div class="venue" title="${escapeHTML(day.venue)}">${escapeHTML(day.venue)}</div><div class="day-bottom"><span class="costume" title="衣装：${escapeHTML(day.costume)}">衣装：${escapeHTML(day.costume)}</span><span class="day-price" id="price-${day.id}">¥0</span></div></div>`;
}
for(let i=0;i<times.length;i++){
 html+=`<div class="cell time">${times[i]}</div>`;
 for(const day of days){
  const ev=getEvent(day,i);
  if(!ev){html+='<div class="cell blank">—</div>';continue}
  const id=`${day.id}-${i}`,name=escapeHTML(ev.name),differentTime=ev.time!==times[i],max=ev.type==='sport'?1:9999;
  html+=`<div class="cell event type-${ev.type}"><span class="name" title="${name}">${name}</span><span class="start${differentTime?' different-time':''}">${ev.time}</span><input class="qty" id="q-${id}" data-id="${id}" data-day="${day.id}" data-price="${unitPrice(ev)}" aria-label="${day.label} ${name} ${ev.time} の参加券枚数${max===1?'（上限1枚）':''}" type="number" inputmode="numeric" min="0" max="${max}" step="1" value="${valid(values[id],max)}"></div>`;
 }
}
grid.innerHTML=html;
const fmt=new Intl.NumberFormat('ja-JP');
function refresh(){
 const totals=Object.fromEntries(days.map(day=>[day.id,{count:0,price:0}]));
 grid.querySelectorAll('.qty').forEach(input=>{const n=valid(input.value,Number(input.max));totals[input.dataset.day].count+=n;totals[input.dataset.day].price+=n*Number(input.dataset.price);input.parentElement.classList.toggle('has-value',n>0)});
 let allCount=0,allPrice=0;
 for(const day of days){const sum=totals[day.id];allCount+=sum.count;allPrice+=sum.price;document.getElementById(`count-${day.id}`).textContent=`${fmt.format(sum.count)}枚`;document.getElementById(`price-${day.id}`).textContent=`¥${fmt.format(sum.price)}`}
 document.getElementById('allCount').textContent=fmt.format(allCount);document.getElementById('allPrice').textContent=`¥${fmt.format(allPrice)}`;
}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(values))}catch(_){}}
grid.addEventListener('input',e=>{if(!e.target.matches('.qty'))return;const input=e.target;input.value=valid(input.value,Number(input.max));values[input.dataset.id]=Number(input.value);save();refresh()});
grid.addEventListener('change',e=>{if(!e.target.matches('.qty'))return;const input=e.target;input.value=valid(input.value,Number(input.max));values[input.dataset.id]=Number(input.value);save();refresh()});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('参加券枚数をすべて0にしますか？'))return;values={};grid.querySelectorAll('.qty').forEach(el=>el.value=0);save();refresh()});
document.getElementById('csv').addEventListener('click',()=>{
 const rows=[['日付','会場','衣装','イベント名','開始時刻','参加券枚数','商品単価（税込円）','商品代（税込円）']];
 for(const day of days)for(let i=0;i<times.length;i++){const ev=getEvent(day,i);if(!ev)continue;const input=document.getElementById(`q-${day.id}-${i}`),n=valid(input.value,Number(input.max)),price=unitPrice(ev);rows.push([day.date,day.venue,day.costume,ev.name,ev.time,n,price,n*price])}
 const quote=value=>'"'+String(value).replaceAll('"','""')+'"';const csv='\ufeff'+rows.map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='rosy_2026_tickets.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
const captureButton=document.getElementById('capture');
captureButton.addEventListener('click',async()=>{
 if(!navigator.mediaDevices?.getDisplayMedia){alert('このブラウザーは画面キャプチャに対応していません。ChromeやEdgeで開いてください。');return}
 let stream;
 try{
  captureButton.disabled=true;
  stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false,preferCurrentTab:true});
  const track=stream.getVideoTracks()[0];
  if(track.getSettings().displaySurface && track.getSettings().displaySurface!=='browser'){
   alert('このページを開いているブラウザーのタブを選択してください。画面全体や別のウィンドウは保存しません。');return;
  }
  const video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=stream;
  await video.play();
  if(!video.videoWidth||!video.videoHeight)await new Promise(resolve=>video.addEventListener('loadedmetadata',resolve,{once:true}));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(!video.videoWidth||!video.videoHeight)throw new Error('キャプチャ画像を取得できませんでした');
  const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('PNG画像を作成できませんでした');
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rosy_2026_screen.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(error){if(error.name!=='NotAllowedError')alert('画面キャプチャを保存できませんでした。ブラウザーの共有画面で「このタブ」を選んで再試行してください。')}finally{stream?.getTracks().forEach(track=>track.stop());captureButton.disabled=false}
});
refresh();
</script>
</body>
</html>
